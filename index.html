<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Metric/Imperial Unit Conversion</h1>
      <input type="text" id="input-el" value="0"></input>
      <button id="convert-btn">Convert</button>
    </div>
    <div class="unit-container">
      <div class="length-container" id = "div-length">
        <h1 class="heading-length">Length (Meter/Feet)</h1>
      </div>
      <div class="volume-container" id = "div-volume">
        <h2 class="heading-volume">Volume (Liters/Gallons)</h2>
      </div>
      <div class="mass-container" id = "div-mass">
        <h2 class="heading-mass">Mass (Kilograms/Pounds)</h2>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
